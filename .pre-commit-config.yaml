# Based on templates/kotlin-gradle.pre-commit-config.yaml from https://github.com/cer/pre-commit-hooks
# Install with:
#   pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/cer/pre-commit-hooks
    rev: v1.1.0
    hooks:
      - id: gitleaks-staged
      - id: gitleaks-commit-message
      - id: block-claude-coauthor
      - id: shellcheck
        exclude: (^|/)gradlew$  # generated by Gradle
  - repo: local
    hooks:
      - id: run-codescene
        name: Run CodeScene
        entry: codescene-precommit.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gradle-test
        name: Run ./gradlew test
        entry: ./gradlew test
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
